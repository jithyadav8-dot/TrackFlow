rl:
  algorithm: MaskablePPO
  policy: MlpPolicy
  network: {hidden_layers: [128, 128], activation: tanh}
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  total_timesteps: 500000
  n_envs: 4
  training_seeds: [42, 123, 2026]
  device: cpu
  validation_interval: 50000
